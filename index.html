<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマート・ルーレット抽選器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"M PLUS Rounded 1c"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.5);
    }

    /* Glow pulse animation for winner modal */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .glow-aura {
      animation: pulse-ring 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans selection:bg-rose-500 selection:text-white flex flex-col">

  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 sm:px-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center shadow-lg shadow-rose-500/20">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-black tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
            スマート・ルーレット
          </h1>
          <p class="text-xs text-slate-400 flex flex-wrap items-center gap-1.5">
            <span>高精度ランダム抽選</span>
            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 font-mono font-semibold" title="Web Cryptography APIによる暗号学的乱数で完全公平な抽選を行っています">
              <svg class="w-3 h-3 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
              CSPRNG (暗号学的乱数)
            </span>
          </p>
        </div>
      </div>

      <!-- Quick Preset & Mute Controls -->
      <div class="flex items-center gap-2">
        <button id="soundToggleBtn" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700/60" title="効果音のON/OFF">
          <svg id="soundOnIcon" class="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" />
          </svg>
          <svg id="soundOffIcon" class="w-5 h-5 text-slate-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
          </svg>
        </button>

        <button id="resetAllBtn" class="px-3 py-2 text-xs font-semibold rounded-xl bg-slate-800 hover:bg-rose-950/40 text-slate-300 hover:text-rose-400 transition-colors border border-slate-700/60 flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          リセット
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- Left Column: Wheel Display and Main Spin Button (7 Cols on LG) -->
    <section class="lg:col-span-7 flex flex-col items-center justify-center bg-slate-800/40 border border-slate-800/80 rounded-3xl p-6 md:p-8 backdrop-blur shadow-2xl relative overflow-hidden">
      <!-- Ambient background blur lights -->
      <div class="absolute -top-24 -left-24 w-72 h-72 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -right-24 w-72 h-72 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Current item count badge -->
      <div class="w-full flex items-center justify-between mb-4 z-10">
        <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700/50">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          候補数: <strong id="itemCountDisplay" class="text-white">0</strong> 件
        </span>
        <div class="text-xs text-slate-400">
          合計比率: <span id="totalWeightDisplay" class="font-semibold text-slate-200">100</span>
        </div>
      </div>

      <!-- Wheel Canvas Container -->
      <div class="relative w-full max-w-[420px] aspect-square flex items-center justify-center my-2 select-none">
        
        <!-- Center Pointer (Top Indicator) -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 -mt-3.5 z-20 flex flex-col items-center filter drop-shadow-[0_4px_8px_rgba(0,0,0,0.6)]">
          <!-- Outer Needle Icon -->
          <div id="wheelPointer" class="transition-transform duration-75">
            <svg class="w-10 h-10 text-rose-500" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 24L4 6a2 2 0 0 1 1.8-2.9h12.4a2 2 0 0 1 1.8 2.9L12 24z"/>
              <path d="M12 18L7 6h10L12 18z" fill="#fecdd3" />
            </svg>
          </div>
        </div>

        <!-- Wheel Canvas -->
        <div class="w-full h-full p-2 rounded-full bg-gradient-to-b from-slate-700 to-slate-900 shadow-[inset_0_4px_12px_rgba(0,0,0,0.6)] flex items-center justify-center">
          <canvas id="rouletteCanvas" class="w-full h-full rounded-full cursor-pointer transition-transform duration-150 active:scale-[0.99]"></canvas>
        </div>

        <!-- Center Hub Pin -->
        <div id="centerPinBtn" class="absolute w-20 h-20 rounded-full bg-gradient-to-b from-slate-100 to-slate-300 text-slate-900 font-extrabold text-sm flex flex-col items-center justify-center shadow-[0_8px_20px_rgba(0,0,0,0.6),0_0_0_6px_rgba(30,41,59,0.8)] cursor-pointer hover:scale-105 active:scale-95 transition-all z-20 select-none">
          <span class="tracking-widest text-[11px] text-slate-500 font-bold -mb-0.5">TAP!</span>
          <span class="text-base font-black text-rose-600">START</span>
        </div>
      </div>

      <!-- Action Spin Controls -->
      <div class="w-full max-w-[420px] mt-6 flex flex-col sm:flex-row gap-3 z-10">
        <button id="spinBtn" class="flex-1 py-4 px-6 rounded-2xl bg-gradient-to-r from-rose-500 via-rose-600 to-amber-500 hover:from-rose-600 hover:to-amber-600 text-white font-black text-lg tracking-wider shadow-lg shadow-rose-500/30 hover:shadow-rose-500/50 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
          <svg class="w-6 h-6 group-hover:rotate-45 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span id="spinBtnText">ルーレットを回す！</span>
        </button>

        <button id="shuffleBtn" class="py-3 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-semibold text-sm border border-slate-700 transition-colors flex items-center justify-center gap-2" title="項目の並び順をシャッフル">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          シャッフル
        </button>
      </div>

      <!-- Quick Option Checkboxes -->
      <div class="w-full max-w-[420px] mt-4 pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
        <label class="flex items-center gap-2 cursor-pointer hover:text-slate-200 transition-colors">
          <input type="checkbox" id="autoRemoveWonCheckbox" class="w-4 h-4 rounded text-rose-500 focus:ring-rose-500 bg-slate-700 border-slate-600">
          <span>当選した項目を自動で除外</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer hover:text-slate-200 transition-colors">
          <input type="checkbox" id="fastSpinCheckbox" class="w-4 h-4 rounded text-rose-500 focus:ring-rose-500 bg-slate-700 border-slate-600">
          <span>高速スピンモード (短縮)</span>
        </label>
      </div>
    </section>

    <!-- Right Column: Candidate Management & Batch Edit (5 Cols on LG) -->
    <section class="lg:col-span-5 flex flex-col gap-5">
      
      <!-- Card: Candidate Names Manager -->
      <div class="bg-slate-800/40 border border-slate-800/80 rounded-3xl p-5 md:p-6 backdrop-blur shadow-xl">
        <!-- Tabs for Switching Mode: Single Add / Bulk Text Edit -->
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-700/60">
          <h2 class="font-bold text-base text-slate-200 flex items-center gap-2">
            <svg class="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            抽選リスト設定
          </h2>
          <div class="flex bg-slate-900/60 p-1 rounded-xl border border-slate-800 text-xs">
            <button id="tabListBtn" class="px-3 py-1 rounded-lg font-semibold bg-rose-500 text-white transition-all shadow-sm">一覧</button>
            <button id="tabBulkBtn" class="px-3 py-1 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all">一括入力</button>
          </div>
        </div>

        <!-- View 1: List View with Single Add Form -->
        <div id="listViewContainer" class="flex flex-col gap-4">
          <!-- Add Single Item Input -->
          <form id="addItemForm" class="flex gap-2">
            <div class="relative flex-1">
              <input type="text" id="newItemNameInput" maxlength="30" placeholder="新しい名前を入力..." 
                class="w-full bg-slate-900/80 border border-slate-700/70 focus:border-rose-500 focus:ring-1 focus:ring-rose-500 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition-all">
            </div>
            <div class="w-20">
              <input type="number" id="newItemWeightInput" min="1" max="100" value="1" title="重み (比率)" placeholder="重み"
                class="w-full bg-slate-900/80 border border-slate-700/70 focus:border-rose-500 focus:ring-1 focus:ring-rose-500 rounded-xl px-2.5 py-2.5 text-sm text-center text-slate-100 outline-none transition-all" />
            </div>
            <button type="submit" class="px-4 py-2.5 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-bold text-sm rounded-xl transition-all flex items-center justify-center shrink-0 shadow-md shadow-rose-500/20">
              追加
            </button>
          </form>

          <!-- Candidate List Scroll Area -->
          <div id="itemsList" class="max-h-72 overflow-y-auto space-y-2 pr-1">
            <!-- Dynamic item cards rendered by JS -->
          </div>
        </div>

        <!-- View 2: Bulk Textarea Mode -->
        <div id="bulkViewContainer" class="hidden flex flex-col gap-3">
          <p class="text-xs text-slate-400">1行に1つの項目名を入力してください。改行で区切られます。</p>
          <textarea id="bulkTextarea" rows="8" class="w-full bg-slate-900/90 border border-slate-700/70 focus:border-rose-500 focus:ring-1 focus:ring-rose-500 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 outline-none font-mono resize-none"></textarea>
          <button id="applyBulkBtn" class="w-full py-2.5 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-bold text-sm rounded-xl transition-all shadow-md">
            リストに反映する
          </button>
        </div>

        <!-- Quick Presets Carousel -->
        <div class="mt-4 pt-4 border-t border-slate-700/50">
          <span class="text-xs font-semibold text-slate-400 block mb-2">テンプレートから選択:</span>
          <div class="flex flex-wrap gap-1.5">
            <button class="preset-pill px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 hover:text-white border border-slate-700 transition" data-preset="lunch">🍽️ ランチ候補</button>
            <button class="preset-pill px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 hover:text-white border border-slate-700 transition" data-preset="numbers">🎲 数字 (1〜6)</button>
            <button class="preset-pill px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 hover:text-white border border-slate-700 transition" data-preset="colors">🎨 カラー</button>
            <button class="preset-pill px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 hover:text-white border border-slate-700 transition" data-preset="penalty">⚡ 罰ゲーム</button>
            <button class="preset-pill px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 hover:text-white border border-slate-700 transition" data-preset="members">👥 メンバー(A〜F)</button>
          </div>
        </div>
      </div>

      <!-- Card: Winners History -->
      <div class="bg-slate-800/40 border border-slate-800/80 rounded-3xl p-5 backdrop-blur shadow-xl">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-700/60">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h3 class="font-bold text-sm text-slate-200">抽選の履歴 (<span id="historyCount">0</span>)</h3>
          </div>
          <div class="flex items-center gap-1">
            <button id="copyHistoryBtn" class="text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition flex items-center gap-1" title="履歴をコピー">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
              コピー
            </button>
            <button id="clearHistoryBtn" class="text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-rose-900/30 text-slate-400 hover:text-rose-400 border border-slate-700 transition">
              クリア
            </button>
          </div>
        </div>

        <ul id="historyList" class="space-y-2 max-h-40 overflow-y-auto pr-1 text-xs text-slate-300">
          <li class="text-slate-500 text-center py-4 italic">まだ抽選履歴はありません</li>
        </ul>
      </div>

    </section>
  </main>

  <!-- Winner Announcement Modal -->
  <div id="winnerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-gradient-to-b from-slate-800 to-slate-900 border border-slate-700 max-w-md w-full rounded-3xl p-6 sm:p-8 text-center shadow-2xl relative transform scale-90 transition-all duration-300" id="modalCard">
      
      <!-- Top Trophy Icon with glowing ring -->
      <div class="relative w-20 h-20 mx-auto -mt-14 mb-4">
        <div class="absolute inset-0 bg-rose-500 rounded-full blur-xl opacity-60 glow-aura"></div>
        <div class="relative w-20 h-20 bg-gradient-to-tr from-amber-400 to-rose-500 rounded-full flex items-center justify-center shadow-xl border-4 border-slate-900">
          <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
          </svg>
        </div>
      </div>

      <h3 class="text-xs font-black uppercase tracking-widest text-amber-400 mb-1">WINNER</h3>
      <h2 class="text-lg font-bold text-slate-300 mb-4">見事当選したのは…</h2>

      <!-- Winning Name Box -->
      <div class="py-5 px-4 rounded-2xl bg-slate-950/80 border border-rose-500/30 mb-6 shadow-inner">
        <span id="winningItemName" class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-rose-300 to-pink-200 break-words leading-tight">
          項目名
        </span>
      </div>

      <!-- Action Buttons in Modal -->
      <div class="flex flex-col gap-2.5">
        <button id="modalSpinAgainBtn" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-rose-500 to-amber-500 hover:from-rose-600 hover:to-amber-600 text-white font-bold text-sm tracking-wide shadow-lg shadow-rose-500/20 active:scale-98 transition">
          もう一度回す
        </button>

        <div class="grid grid-cols-2 gap-2">
          <button id="modalRemoveAndCloseBtn" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-rose-300 hover:text-rose-200 border border-slate-700 text-xs font-semibold transition">
            当選項目を除外
          </button>
          <button id="modalCloseBtn" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 text-xs font-semibold transition">
            閉じる
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification element -->
  <div id="toastMessage" class="fixed bottom-6 right-6 z-50 bg-slate-800 border border-slate-700 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl transform translate-y-12 opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
    <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
    <span id="toastText">メッセージ</span>
  </div>

  <script>
    // --- Audio Synthesizer (No external sound files required) ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playClick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.04);

          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) {
          console.warn("Audio click failed", e);
        }
      }

      playFanfare() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = now + (idx * 0.1);
            const duration = idx === notes.length - 1 ? 0.6 : 0.18;

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);

            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(0.25, start + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(start);
            osc.stop(start + duration);
          });
        } catch (e) {
          console.warn("Audio fanfare failed", e);
        }
      }
    }

    const sound = new SoundEffects();

    // --- Cryptographically Secure Pseudo-Random Number Generator (CSPRNG) ---
    /**
     * Web Cryptography API (crypto.getRandomValues) を用いた
     * 53ビット精度 (IEEE 754 倍精度浮動小数点数の仮数部一杯) の安全な一様乱数 [0, 1) を生成
     */
    function secureRandom() {
      const buffer = new Uint32Array(2);
      window.crypto.getRandomValues(buffer);
      // 上位27ビット + 下位26ビット で 53ビットの一様乱数を合成
      const high = buffer[0] >>> 5;
      const low = buffer[1] >>> 6;
      return (high * 67108864 + low) / 9007199254740992;
    }

    /**
     * 指定範囲 [min, max] の整数を暗号学的に偏りなく生成 (モジュロバイアスを排除)
     */
    function secureRandomInt(min, max) {
      const range = max - min + 1;
      const maxLimit = Math.floor(0xFFFFFFFF / range) * range;
      const buf = new Uint32Array(1);
      do {
        window.crypto.getRandomValues(buf);
      } while (buf[0] >= maxLimit);
      return min + (buf[0] % range);
    }

    const canvas = document.getElementById('rouletteCanvas');
    const ctx = canvas.getContext('2d');
    let canvasSize = 400;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvasSize = Math.floor(Math.min(rect.width, rect.height));
      
      canvas.width = canvasSize * dpr;
      canvas.height = canvasSize * dpr;
      canvas.style.width = `${canvasSize}px`;
      canvas.style.height = `${canvasSize}px`;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawRoulette();
    }

    function getTotalWeight() {
      return items.reduce((sum, item) => sum + (Number(item.weight) || 1), 0);
    }

    // Draw the Roulette Wheel
    function drawRoulette() {
      ctx.clearRect(0, 0, canvasSize, canvasSize);

      const centerX = canvasSize / 2;
      const centerY = canvasSize / 2;
      const radius = (canvasSize / 2) - 8;

      if (items.length === 0) {
        // Empty placeholder state
        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.fillStyle = '#1e293b';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#334155';
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 15px "M PLUS Rounded 1c", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('項目を追加してください', centerX, centerY);
        ctx.restore();
        return;
      }

      const totalWeight = getTotalWeight();
      let startAngle = currentRotation;

      items.forEach((item, index) => {
        const itemWeight = Number(item.weight) || 1;
        const sliceAngle = (itemWeight / totalWeight) * 2 * Math.PI;
        const endAngle = startAngle + sliceAngle;
        const color = PALETTE[index % PALETTE.length];

        // Draw Sector Wedge
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();

        // Edge separator
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.4)';
        ctx.stroke();

        // Draw Text inside sector
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';

        // Dynamic text size based on slice count and length
        const baseFontSize = items.length > 16 ? 11 : items.length > 8 ? 13 : 15;
        ctx.font = `bold ${baseFontSize}px "M PLUS Rounded 1c", sans-serif`;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 4;

        // Truncate text if too long
        let displayTitle = item.name;
        if (displayTitle.length > 12 && items.length > 6) {
          displayTitle = displayTitle.substring(0, 10) + '…';
        }

        ctx.fillText(displayTitle, radius - 24, 0);
        ctx.restore();

        startAngle = endAngle;
      });

      // Outer rim ring
      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();
      ctx.restore();

      // Outer golden border line
      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius - 3, 0, 2 * Math.PI);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.stroke();
      ctx.restore();
    }

    // Find which sector is currently pointing at the top (1.5 * PI)
    function getCurrentSector() {
      if (items.length === 0) return null;

      const pointerAngle = 1.5 * Math.PI; // Top position
      const totalWeight = getTotalWeight();

      // Normalize current rotation within [0, 2*PI)
      let normRot = currentRotation % (2 * Math.PI);
      if (normRot < 0) normRot += 2 * Math.PI;

      let targetAngle = pointerAngle - normRot;
      while (targetAngle < 0) targetAngle += 2 * Math.PI;
      targetAngle = targetAngle % (2 * Math.PI);

      let accumulated = 0;
      for (let i = 0; i < items.length; i++) {
        const sliceAngle = (Number(items[i].weight || 1) / totalWeight) * 2 * Math.PI;
        if (targetAngle >= accumulated && targetAngle < accumulated + sliceAngle) {
          return { item: items[i], index: i };
        }
        accumulated += sliceAngle;
      }
      return { item: items[0], index: 0 };
    }

    // Pointer tick handler (plays click sound without shaking the pointer)
    function triggerPointerTick() {
      sound.playClick();
    }

    // Spin animation handler
    function spinWheel() {
      if (isSpinning || items.length === 0) return;

      sound.init(); // Ensure user gesture unlocked audio
      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('spinBtnText').textContent = '抽選中...';

      const isFast = document.getElementById('fastSpinCheckbox').checked;
      const totalSpinTime = isFast ? 3000 : 5500; // ms
      const startTime = performance.now();

      // Determine randomized total rotation using CSPRNG
      // Spin between 6 to 12 full turns + cryptographically secure random offset
      const fullRotations = (isFast ? 5 : 8) + secureRandom() * 4;
      const totalDelta = fullRotations * 2 * Math.PI;
      const startAngle = currentRotation;

      lastTickAngle = startAngle;

      function cubicEaseOut(t) {
        return 1 - Math.pow(1 - t, 4);
      }

      function animateSpin(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / totalSpinTime, 1);
        const ease = cubicEaseOut(progress);

        currentRotation = startAngle + totalDelta * ease;

        // Sound & tick effect on boundary pass
        const deltaSinceTick = Math.abs(currentRotation - lastTickAngle);
        const avgSliceAngle = (2 * Math.PI) / Math.max(items.length, 1);
        if (deltaSinceTick >= avgSliceAngle * 0.7) {
          triggerPointerTick();
          lastTickAngle = currentRotation;
        }

        drawRoulette();

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          // Finish spinning
          isSpinning = false;
          document.getElementById('spinBtn').disabled = false;
          document.getElementById('spinBtnText').textContent = 'ルーレットを回す！';
          finalizeWinner();
        }
      }

      requestAnimationFrame(animateSpin);
    }

    function finalizeWinner() {
      const winner = getCurrentSector();
      if (!winner) return;

      pendingWinner = winner;

      // Play victory sound & confetti
      sound.playFanfare();
      launchConfetti();

      // Record to history
      addHistoryRecord(winner.item.name);

      // Check auto-remove setting
      const autoRemove = document.getElementById('autoRemoveWonCheckbox').checked;
      if (autoRemove) {
        showWinnerModal(winner.item.name, true);
        removeItemByIndex(winner.index, false);
      } else {
        showWinnerModal(winner.item.name, false);
      }
    }

    // Confetti firework effects
    function launchConfetti() {
      if (typeof confetti !== 'function') return;

      const duration = 2.5 * 1000;
      const animationEnd = Date.now() + duration;

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }
        const particleCount = 40 * (timeLeft / duration);
        confetti({
          particleCount,
          startVelocity: 30,
          spread: 360,
          origin: {
            x: secureRandom(),
            y: secureRandom() * 0.4 + 0.1
          },
          colors: ['#f43f5e', '#fbbf24', '#38bdf8', '#4ade80', '#c084fc']
        });
      }, 250);
    }

      return String(str)

      });

      document.getElementById('copyHistoryBtn').addEventListener('click', () => {
        if (history.length === 0) {
          showToast("コピーする履歴がありません");
          return;
        }
        const text = history.map((h, i) => `${history.length - i}. ${h.name} (${h.time})`).join('\n');
        copyToClipboard(text);
      });

      // Reset All button
      document.getElementById('resetAllBtn').addEventListener('click', () => {
        items = [...PRESETS.lunch];
        renderItemList();
        showToast("初期状態にリセットしました");
      });

      // Winner Modal actions
      document.getElementById('modalCloseBtn').addEventListener('click', closeWinnerModal);
      
      document.getElementById('modalRemoveAndCloseBtn').addEventListener('click', () => {
        if (pendingWinner) {
          removeItemByIndex(pendingWinner.index, true);
          showToast(`「${pendingWinner.item.name}」を除外しました`);
        }
        closeWinnerModal();
      });

      document.getElementById('modalSpinAgainBtn').addEventListener('click', () => {
        closeWinnerModal();
        setTimeout(() => {
          spinWheel();
        }, 300);
      });
    });
  </script>
</body>
</html>
